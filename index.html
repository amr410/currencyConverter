<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Title</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body">
    <nav class="navbar bg-black px-5">
      <div
        class="navbar-brand w-100 d-flex justify-content-between align-items-center mx-5"
      >
        <img
          class="border rounded"
          src="https://exchanger-nine.vercel.app/images/nav-banner.png"
          alt="Currency-Converter"
        />
        <h3 class="text-warning fw-bold fs-4">Currency-Converter</h3>
      </div>
    </nav>
    <div class="container">
      <div class="row my-5 justify-content-center align-items-center">
        <div class="col-8 my-3 converter rounded d-flex flex-column gap-4 p-4">
          <h4 class="text-secondary opacity-75">Amount</h4>
          <div class="position-relative">
            <input
              type="text"
              class="bg-transparent text-white w-100 border-0 border-bottom border-primary"
              placeholder="1 By Default"
            />
            <i
              data-swap
              class="position-absolute fw-bold fs-1 text-primary logo fa-solid fa-arrow-right-arrow-left"
            ></i>
          </div>
          <div class="w-100 position-relative text-center mt-3">
            <img data-flag-one src="" class="position-absolute" alt="flag-1" />
            <select
              data-options-one
              class="px-5 bg-black text-white border border-white w-75 p-1"
            >
              <option value=""></option>
            </select>
          </div>
          <div class="w-100 position-relative text-center">
            <img data-flag-two src="" class="position-absolute" alt="flag-1" />
            <select
              data-options-two
              class="px-5 bg-black text-white border border-white w-75 p-1"
            ></select>
          </div>
          <div class="row justify-content-center">
            <button
              data-convert-btn
              class="btn btn-dark bg-opacity-75 col-6 text-white"
            >
              convert
            </button>
          </div>

          <div
            data-before-after
            class="text-center text-light fw-bold fs-3 mb-5 pb-5"
          >
            <h1>1 AED = 1 AED</h1>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
